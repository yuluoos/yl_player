name: yl_player_workspace
publish_to: none
environment:
  sdk: ^3.12.0
workspace:
  - packages/yl_player
  - packages/yl_player/example
  - packages/yl_player_platform_interface
  - packages/yl_player_android
  - packages/yl_player_android/example
  - packages/yl_player_apple
  # Unendorsed Apple migration artifacts retained until final cleanup.
  - packages/yl_player_ios
  - packages/yl_player_ios/example
  - packages/yl_player_macos

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  yl_player_apple: ^0.2.0-dev.1
