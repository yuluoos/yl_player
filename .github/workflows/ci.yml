name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch pinned Apple migration provenance
        run: git fetch --no-tags --depth=1 origin ce368c55ad291b163b02157b487dbbf798a69892
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: sh tool/check_foundation.sh

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/yl_player_android/example/android
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ github.workspace }}
      - run: sh packages/yl_player_android/tool/check_pigeon.sh
        working-directory: ${{ github.workspace }}
      - run: ./gradlew :yl_player_android:testDebugUnitTest --stacktrace

  android-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Build independent Android consumer
        env:
          YL_REPO_ROOT: ${{ github.workspace }}
          YL_CONSUMER_OUTPUT: ${{ runner.temp }}/yl-consumers
          YL_CONSUMER_LOG_DIR: ${{ runner.temp }}/consumer-logs
        run: sh tool/check_consumers.sh --android-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-consumer-evidence
          path: ${{ runner.temp }}/consumer-logs
          if-no-files-found: error

  android-native-integration:
    needs: android-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Boot exact API emulator
        env:
          YL_ANDROID_API: ${{ matrix.api }}
        run: |
          YL_ANDROID_DEVICE_ID=$(sh tool/boot_ci_android_emulator.sh)
          echo "YL_ANDROID_DEVICE_ID=$YL_ANDROID_DEVICE_ID" >> "$GITHUB_ENV"
      - name: Android integration after shared JVM gate
        env:
          YL_ANDROID_SKIP_JVM: '1'
        run: sh tool/check_native_android.sh
      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p android-failure
          adb devices -l > android-failure/devices.txt
          if [ -n "$YL_ANDROID_DEVICE_ID" ]; then
            adb -s "$YL_ANDROID_DEVICE_ID" logcat -d > android-failure/logcat.txt
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-api-${{ matrix.api }}-failure
          path: android-failure

  ios-native-integration:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify shared Apple schema and binary contract
        run: |
          sh packages/yl_player_apple/tool/check_pigeon.sh
          sh packages/yl_player_apple/tool/apple_ffmpeg/test_build_contract.sh
          python3 packages/yl_player_apple/tool/apple_ffmpeg/test_verify_artifact.py
      - name: Boot iOS Simulator
        run: echo "YL_IOS_SIMULATOR_ID=$(sh tool/boot_ci_ios_simulator.sh)" >> "$GITHUB_ENV"
      - run: python3 -B tool/consumer_fixtures/apple_flutter/test_runtime_evidence.py
      - run: sh tool/check_native_ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-exact-runtime-evidence
          path: packages/yl_player/example/build/apple-evidence
          if-no-files-found: error

  apple-consumers:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            ${{ runner.temp }}/yl-consumers/apple/pub-cache
            ${{ runner.temp }}/apple-package-cache
          key: apple-consumers-${{ runner.os }}-${{ hashFiles('packages/yl_player_apple/pubspec.yaml', 'packages/yl_player_apple/darwin/yl_player_apple.podspec', 'packages/yl_player_apple/darwin/yl_player_apple/Package.swift') }}
          restore-keys: apple-consumers-${{ runner.os }}-
      - name: Select iOS Simulator
        run: echo "YL_IOS_SIMULATOR=$(sh tool/boot_ci_ios_simulator.sh)" >> "$GITHUB_ENV"
      - name: Build independent Apple consumers
        env:
          YL_REPO_ROOT: ${{ github.workspace }}
          YL_CONSUMER_OUTPUT: ${{ runner.temp }}/yl-consumers
          YL_APPLE_CONSUMERS: ${{ runner.temp }}/yl-consumers/apple
          YL_APPLE_PACKAGE_CACHE_ROOT: ${{ runner.temp }}/apple-package-cache
          YL_CONSUMER_LOG_DIR: ${{ runner.temp }}/consumer-logs
          YL_APPLE_LOG_DIR: ${{ runner.temp }}/consumer-logs
        run: sh tool/check_consumers.sh --apple-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-consumer-evidence
          path: |
            ${{ runner.temp }}/consumer-logs
            ${{ runner.temp }}/yl-consumers/apple/*/results-*.xcresult
          if-no-files-found: error

  macos-native-integration:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify shared Apple schema and binary contract
        run: |
          sh packages/yl_player_apple/tool/check_pigeon.sh
          sh packages/yl_player_apple/tool/apple_ffmpeg/test_build_contract.sh
          python3 packages/yl_player_apple/tool/apple_ffmpeg/test_verify_artifact.py
      - run: python3 -B tool/consumer_fixtures/apple_flutter/test_runtime_evidence.py
      - run: sh tool/check_native_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-exact-runtime-evidence
          path: packages/yl_player/example/build/apple-evidence
          if-no-files-found: error
