name: yl_player_example
description: Demonstrates the yl_player public API.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  yl_player: ^0.2.0-dev.1

dev_dependencies:
  yl_player_android: ^0.2.0-dev.1
  yl_player_apple: ^0.2.0-dev.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/test_media/android_audio_only.m4a
    - assets/test_media/h264_aac.flv
    - assets/test_media/h264_mp3.flv
    - assets/test_media/hevc_aac.flv
    - assets/test_media/h264_aac.mkv
    - assets/test_media/hls_encrypted_segment0.ts
    - assets/test_media/hls_key.bin
    - assets/test_media/network_seek_h264_aac.mkv
    - assets/test_media/two_audio_tracks.mkv
