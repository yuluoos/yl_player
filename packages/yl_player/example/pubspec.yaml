name: yl_player_example
description: Demonstrates the yl_player public API.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  yl_player: ^0.3.0-dev.5
  yl_player_media_delivery: ^0.3.0-dev.5

dev_dependencies:
  crypto: ^3.0.7
  yl_player_platform_interface: ^0.3.0-dev.5
  yl_player_android: ^0.3.0-dev.5
  yl_player_apple: ^0.3.0-dev.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/test_media/benchmark_601.mkv
    - assets/test_media/benchmark_sdr.mkv
    - assets/test_media/format_matrix/
    - assets/test_media/android_audio_only.m4a
    - assets/test_media/h264_aac.flv
    - assets/test_media/h264_mp3.flv
    - assets/test_media/hevc_aac.flv
    - assets/test_media/hevc_main10_level62_aac.mkv
    - assets/test_media/hevc_main10_level62_aac.mp4
    - assets/test_media/h264_aac.mkv
    - assets/test_media/hls_encrypted_segment0.ts
    - assets/test_media/hls_main10_encrypted_segment0.ts
    - assets/test_media/hls_key.bin
    - assets/test_media/network_seek_h264_aac.mkv
    - assets/test_media/long_60fps_h264_aac.mkv
    - assets/test_media/video_tail_60fps_h264_aac.mkv
    - assets/test_media/two_audio_tracks.mkv
    - assets/test_media/dash/
    - assets/test_media/dash_timeline/
    - assets/test_media/dash_timeline/period0/
    - assets/test_media/dash_timeline/period1/
    - assets/test_media/dash_timeline/independent/
    - assets/test_media/dash_timeline/fractional/
    - assets/test_media/dash_timeline/hevc/
    - assets/test_media/dash_timeline/avc/
    - assets/test_media/dash/period0/
    - assets/test_media/dash/period1/
    - assets/test_media/dash_variants/
    - assets/test_media/dash_variants/period0/
    - assets/test_media/dash_variants/period1/
