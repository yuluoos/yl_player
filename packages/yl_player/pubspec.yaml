name: yl_player
description: Hardware-first Flutter playback kernel with federated Android, iOS, and macOS implementations for TVBox-style applications.
version: 0.3.0-dev.4
resolution: workspace
homepage: https://pub.dev/packages/yl_player
repository: https://github.com/yuluoos/yl_player
topics:
  - video
  - player
  - media
  - tv

false_secrets:
  - /test/fixtures/drm_tls/server.key

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  xml: ^7.0.1
  flutter:
    sdk: flutter
  yl_player_android: ^0.3.0-dev.4
  yl_player_apple: ^0.3.0-dev.4
  yl_player_platform_interface: ^0.3.0-dev.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: yl_player_android
      ios:
        default_package: yl_player_apple
      macos:
        default_package: yl_player_apple
