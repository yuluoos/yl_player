name: yl_player
description: Hardware-first Flutter playback kernel with federated Android, iOS, and macOS implementations for TVBox-style applications.
version: 0.2.0-dev.1
resolution: workspace
homepage: https://pub.dev/packages/yl_player
topics:
  - video
  - player
  - media
  - tv

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  yl_player_android: ^0.2.0-dev.1
  yl_player_ios: ^0.2.0-dev.1
  yl_player_macos: ^0.2.0-dev.1
  yl_player_platform_interface: ^0.2.0-dev.1

dev_dependencies:
  yl_player_apple: ^0.2.0-dev.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: yl_player_android
      ios:
        default_package: yl_player_ios
      macos:
        default_package: yl_player_macos
