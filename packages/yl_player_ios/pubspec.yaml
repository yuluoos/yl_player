name: yl_player_ios
description: Endorsed iOS implementation package for the hardware-first yl_player Flutter playback kernel.
version: 0.2.0-dev.1
resolution: workspace
homepage: https://pub.dev/packages/yl_player
topics:
  - video
  - player
  - media

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  yl_player_platform_interface: ^0.2.0-dev.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: yl_player
    platforms:
      ios:
        pluginClass: YlPlayerIosPlugin
        dartPluginClass: YlPlayerIos
