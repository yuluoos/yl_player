name: yl_player_media_core
description: Shared native media input core for yl_player Apple plugins.
version: 0.3.0-dev.3
resolution: workspace
homepage: https://pub.dev/packages/yl_player
repository: https://github.com/yuluoos/yl_player
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: YlPlayerMediaCorePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: YlPlayerMediaCorePlugin
        sharedDarwinSource: true
